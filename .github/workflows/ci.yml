name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      # Same gate as the pre-commit hook. The suite runs offline against the
      # simulated and paper brokers; no broker or API credentials are needed.
      - name: Check (compile, ruff, mypy, pytest)
        run: scripts/check.sh
