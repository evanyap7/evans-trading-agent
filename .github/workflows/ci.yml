name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e . pytest

      # The suite runs offline against the simulated and paper brokers. No
      # broker or API credentials are needed, and none are provided.
      - name: Test
        env:
          TRADING_MODE: shadow
        run: pytest -q
