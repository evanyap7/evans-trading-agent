[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous rule-based swing-trading agent for Webull Singapore, inside a deterministic risk envelope."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "webull-openapi-python-sdk>=3.0.2",
    "yfinance>=1.7.0",
    "feedparser>=6.0.14",
    "databento>=0.87.0",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness-only baseline (pyflakes, import order, bugbear). Style rules stay off.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]  # zip(strict=) churn, not a correctness gate here

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts patch sys.path before importing the package
"tests/*" = ["E402", "E731", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

# ponytail: legacy modules with known Optional/Literal typing errors (46 total at 2026-10-31).
# Fix per module and delete its line here; new modules are gated strictly.
[[tool.mypy.overrides]]
module = [
    "trading_agent.agents",
    "trading_agent.execution",
    "trading_agent.orchestrator",
    "trading_agent.backtest",
    "trading_agent.broker.webull",
]
ignore_errors = true
