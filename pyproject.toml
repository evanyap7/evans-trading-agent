[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous rule-based swing-trading agent for Webull Singapore, inside a deterministic risk envelope."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "webull-openapi-python-sdk>=3.0.2",
    "yfinance>=1.7.0",
    "feedparser>=6.0.14",
    "databento>=0.87.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
